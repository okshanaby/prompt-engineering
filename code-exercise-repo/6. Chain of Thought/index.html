<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Library</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Prompt Library</h1>
      <p class="subtitle">Save and manage your AI prompts</p>
    </header>

    <section class="form-section">
      <form id="prompt-form">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="e.g. Code Review Assistant" required />
        </div>
        <div class="field">
          <label for="model">Model</label>
          <input type="text" id="model" placeholder="e.g. claude-sonnet-4-6" maxlength="100" required />
        </div>
        <div class="field">
          <label for="content">Prompt Content</label>
          <textarea id="content" rows="5" placeholder="Enter your prompt here..." required></textarea>
        </div>
        <div class="field field-inline">
          <label>
            <input type="checkbox" id="is-code" />
            Content is code
          </label>
        </div>
        <button type="submit" class="btn-save">Save Prompt</button>
      </form>
    </section>

    <section class="library-section">
      <div class="library-header">
        <h2>Saved Prompts</h2>
        <div class="library-actions">
          <button id="btn-export" class="btn-action">Export</button>
          <label class="btn-action btn-action--import">
            Import
            <input type="file" id="import-input" accept=".json" hidden />
          </label>
        </div>
      </div>
      <div id="prompt-cards" class="cards-grid"></div>
      <p id="empty-state" class="empty-state">No prompts saved yet. Add one above.</p>
    </section>

    <div id="import-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal">
        <h3 id="modal-title">Import Prompts</h3>
        <p id="modal-body" class="modal-body"></p>
        <div class="modal-actions">
          <button id="modal-merge" class="btn-save">Merge</button>
          <button id="modal-replace" class="btn-action btn-action--danger">Replace All</button>
          <button id="modal-cancel" class="btn-action">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
