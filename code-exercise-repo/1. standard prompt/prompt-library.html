<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Library</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.02em;
    }

    header p {
      color: #64748b;
      margin-top: 0.35rem;
      font-size: 0.9rem;
    }

    /* Form */
    .form-card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .form-card h2 {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 0.4rem;
    }

    input[type="text"], textarea {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.9rem;
      font-family: inherit;
      padding: 0.65rem 0.85rem;
      transition: border-color 0.15s;
      outline: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: #6366f1;
    }

    textarea {
      resize: vertical;
      min-height: 110px;
      line-height: 1.55;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
    }

    .btn-save {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.4rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-save:hover { background: #4f46e5; }
    .btn-save:active { transform: scale(0.97); }

    /* Stats bar */
    .stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .stats-count {
      font-size: 0.8rem;
      color: #64748b;
    }

    .stats-count span {
      color: #94a3b8;
      font-weight: 600;
    }

    /* Prompts list */
    #prompts-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .prompt-card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .prompt-body {
      flex: 1;
      min-width: 0;
    }

    .prompt-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: #f1f5f9;
      margin-bottom: 0.35rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prompt-content {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .prompt-meta {
      font-size: 0.72rem;
      color: #475569;
      margin-top: 0.5rem;
    }

    .btn-delete {
      background: none;
      border: 1px solid #2d3148;
      border-radius: 7px;
      color: #64748b;
      cursor: pointer;
      padding: 0.4rem 0.55rem;
      font-size: 0.8rem;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      line-height: 1;
    }

    .btn-delete:hover {
      border-color: #ef4444;
      color: #ef4444;
      background: rgba(239,68,68,0.07);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #475569;
    }

    .empty-state svg {
      width: 40px;
      height: 40px;
      margin: 0 auto 0.75rem;
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Prompt Library</h1>
      <p>Save and manage your AI prompts in one place.</p>
    </header>

    <div class="form-card">
      <h2>New Prompt</h2>
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. Summarize article" autocomplete="off" />
      </div>
      <div class="field">
        <label for="content">Content</label>
        <textarea id="content" placeholder="Enter your prompt text here…"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn-save" onclick="savePrompt()">Save Prompt</button>
      </div>
    </div>

    <div class="stats">
      <div class="stats-count">Saved prompts: <span id="count">0</span></div>
    </div>

    <div id="prompts-list"></div>
  </div>

  <script>
    const STORAGE_KEY = 'prompt_library';

    function getPrompts() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function setPrompts(prompts) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(prompts));
    }

    function savePrompt() {
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();

      if (!title || !content) {
        alert('Please fill in both the title and content.');
        return;
      }

      const prompts = getPrompts();
      prompts.unshift({
        id: Date.now(),
        title,
        content,
        createdAt: new Date().toISOString(),
      });
      setPrompts(prompts);

      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
      renderPrompts();
    }

    function deletePrompt(id) {
      const prompts = getPrompts().filter(p => p.id !== id);
      setPrompts(prompts);
      renderPrompts();
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric',
      });
    }

    function renderPrompts() {
      const prompts = getPrompts();
      const list = document.getElementById('prompts-list');
      document.getElementById('count').textContent = prompts.length;

      if (prompts.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 9.414V19a2 2 0 01-2 2z"/>
            </svg>
            <p>No prompts saved yet. Add your first one above.</p>
          </div>`;
        return;
      }

      list.innerHTML = prompts.map(p => `
        <div class="prompt-card">
          <div class="prompt-body">
            <div class="prompt-title">${escapeHtml(p.title)}</div>
            <div class="prompt-content">${escapeHtml(p.content)}</div>
            <div class="prompt-meta">${formatDate(p.createdAt)}</div>
          </div>
          <button class="btn-delete" onclick="deletePrompt(${p.id})" title="Delete">✕</button>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Initialize
    renderPrompts();
  </script>
</body>
</html>
